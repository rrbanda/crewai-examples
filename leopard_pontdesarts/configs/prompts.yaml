leopard_pont_des_arts_prompt: |
  A leopard can run at a top speed of 58 km/h.
  The Pont des Arts bridge is 155 meters long.

  Please solve the following step by step:
  1. Convert the leopard's speed from kilometers per hour (km/h) to meters per second (m/s).
  2. Use the formula: time = distance / speed
  3. Show the intermediate steps in plain text.
  4. Return the final result only as a **valid JSON object** (no markdown, no backticks).
     The "time_seconds" field must match your final computed value exactly (e.g., 9.62).

  The output must be valid JSON:
  {
    "time_seconds": <numeric_value>,
    "explanation": "<step-by-step explanation>"
  }
