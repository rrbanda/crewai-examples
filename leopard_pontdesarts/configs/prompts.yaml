leopard_pont_des_arts_prompt: |
  A leopard can run at a top speed of 58 km/h.
  The Pont des Arts bridge is 155 meters long.

  Solve step by step:
  1. Convert speed from km/h to m/s: 1 km/h = 1000 / 3600 m/s
  2. Use formula: time_seconds = distance / speed
  3. Round final answer to 2 decimal places.
  4. Return result only as a **valid JSON object** (no markdown, no backticks). Ensure that `time_seconds` matches your calculation.

  Output format:
  {
    "time_seconds": <calculated_value>,
    "explanation": "<explain the math steps clearly>"
  }
